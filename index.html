<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinapay Corner · Point of Sale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <div class="container-xl d-flex align-items-baseline justify-content-between">
      <h1 class="brand">Tinapay Corner <span class="brand-sub">Point of sale</span></h1>
      <span class="text-secondary">Order <strong id="order-no">#0001</strong></span>
    </div>
  </header>

  <main class="container-xl py-4">
    <div class="row g-4">

      <!-- Products -->
      <section class="col-lg-7 col-xl-8" aria-label="Products">
        <label class="visually-hidden" for="search">Search products</label>
        <input id="search" type="search" class="form-control form-control-lg" placeholder="Search products" autocomplete="off">
        <div id="product-grid" class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-2 mt-1"></div>
        <p id="no-results" class="text-secondary mt-3" hidden></p>
      </section>

      <!-- Order -->
      <aside class="col-lg-5 col-xl-4">
        <div class="order-panel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="fs-5 m-0">Current order</h2>
            <button id="clear-btn" type="button" class="btn btn-link btn-sm p-0">Clear order</button>
          </div>

          <p id="cart-empty" class="text-secondary my-4">No items yet. Select a product to add it.</p>
          <ul id="cart-items" class="list-unstyled m-0"></ul>

          <div class="mt-3">
            <label for="discount" class="form-label small text-secondary mb-1">Discount</label>
            <select id="discount" class="form-select"></select>
          </div>

          <dl class="totals">
            <dt>Subtotal</dt><dd id="subtotal">₱0.00</dd>
            <dt>Discount</dt><dd id="discount-amount">₱0.00</dd>
            <dt class="grand">Total</dt><dd id="total" class="grand">₱0.00</dd>
          </dl>

          <button id="charge-btn" type="button" class="btn btn-ube btn-lg w-100" disabled>Charge ₱0.00</button>
        </div>
      </aside>

    </div>
  </main>

  <!-- Payment -->
  <div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="payTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="payTitle">Payment</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between fs-5">
            <span>Total due</span><strong id="pay-total">₱0.00</strong>
          </div>
          <label for="cash" class="form-label mt-3">Cash received</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text">₱</span>
            <input id="cash" type="number" min="0" step="0.01" inputmode="decimal" class="form-control">
            <button id="exact-btn" type="button" class="btn btn-outline-secondary">Exact</button>
          </div>
          <p id="change-line" class="change mb-0 mt-3" aria-live="polite"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button id="complete-btn" type="button" class="btn btn-ube" disabled>Complete sale</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-label="Receipt" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body"><div id="receipt" class="receipt"></div></div>
        <div class="modal-footer">
          <button id="print-btn" type="button" class="btn btn-outline-secondary">Print receipt</button>
          <button id="new-btn" type="button" class="btn btn-ube">New transaction</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
